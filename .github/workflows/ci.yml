name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexusguard
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: nexusguard_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusguard -d nexusguard_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not integration"
      - run: pytest -m integration
        env:
          NEXUSGUARD_TEST_DATABASE_URL: postgresql+asyncpg://nexusguard:ci_test_only@localhost:5432/nexusguard_test_ci
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
