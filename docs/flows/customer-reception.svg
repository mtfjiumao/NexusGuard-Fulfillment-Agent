<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1740" viewBox="0 0 1600 1740" role="img" aria-labelledby="title desc">
<title id="title">客服会话入口与订单定位流程图</title>
<desc id="desc">规则接待与模型辅助自由输入流程：按入口校验并推荐候选订单，用户确认或切换订单，全程支持自由输入；订单指向不明时澄清。包括三十天推荐规则和会话状态说明。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<style>
text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b46;font-size:18px}
.title{font-size:32px;font-weight:700}.subtitle{font-size:18px;fill:#526579}
.section{font-size:23px;font-weight:700}.label{font-size:16px;fill:#526579}
.small{font-size:16px}.state{fill:#eaf3ff;stroke:#6292cb;stroke-width:1.5}
.process{fill:#fff;stroke:#a4b4c7;stroke-width:1.5}.choice{fill:#fff5df;stroke:#d5ab50;stroke-width:1.5}
.success{fill:#e9f7ef;stroke:#75b38f;stroke-width:1.5}.arrow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
</style>
<rect width="1600" height="1740" fill="#f3f6fa"/>

<text x="48" y="62" text-anchor="start" class="title">
<tspan x="48" dy="0">客服会话入口与订单定位</tspan>
</text>
<text x="48" y="99" text-anchor="start" class="subtitle">
<tspan x="48" dy="0">入口和按钮采用规则 · 候选订单先确认 · 全程支持自由输入 · 第一版一个租户对应一家店铺</tspan>
</text>
<rect x="32" y="130" width="1536" height="460" rx="20" fill="white" stroke="#dce4ee"/>
<text x="60" y="168" text-anchor="start" class="section">
<tspan x="60" dy="0">01  选择候选订单</tspan>
</text>
<text x="60" y="198" text-anchor="start" class="subtitle">
<tspan x="60" dy="0">订单 ID 来自页面入口，但订单归属与状态必须由后端查询。</tspan>
</text>
<rect x="60" y="240" width="220" height="80" rx="13" class="process"/>
<text x="170.0" y="273.5" text-anchor="middle" class="">
<tspan x="170.0" dy="0">进入客服</tspan>
<tspan x="170.0" dy="27">读取可信用户身份</tspan>
</text>
<rect x="350" y="220" width="240" height="65" rx="13" class="choice"/>
<text x="470.0" y="259.5" text-anchor="middle" class="">
<tspan x="470.0" dy="0">从订单页面进入</tspan>
</text>
<rect x="350" y="335" width="240" height="65" rx="13" class="choice"/>
<text x="470.0" y="374.5" text-anchor="middle" class="">
<tspan x="470.0" dy="0">从店铺等其他入口进入</tspan>
</text>
<polyline points="280,280 315,280 315,252 350,252" class="arrow"/>
<polyline points="315,280 315,367 350,367" class="arrow"/>
<rect x="660" y="220" width="270" height="65" rx="13" class="process"/>
<text x="795.0" y="259.5" text-anchor="middle" class="">
<tspan x="795.0" dy="0">校验入口订单归属</tspan>
</text>
<polyline points="590,252 660,252" class="arrow"/>
<rect x="660" y="335" width="270" height="90" rx="13" class="process"/>
<text x="795.0" y="373.5" text-anchor="middle" class="">
<tspan x="795.0" dy="0">查找该店最近一笔</tspan>
<tspan x="795.0" dy="27">符合推荐条件的订单</tspan>
</text>
<polyline points="590,367 660,367" class="arrow"/>
<polyline points="795,285 795,335" class="arrow"/>
<text x="881" y="314" text-anchor="middle" class="label">
<tspan x="881" dy="0">无效或无权访问</tspan>
</text>
<rect x="1100" y="220" width="400" height="80" rx="13" class="state"/>
<text x="1300.0" y="253.5" text-anchor="middle" class="">
<tspan x="1300.0" dy="0">展示候选订单卡片</tspan>
<tspan x="1300.0" dy="27">“你想咨询这笔订单吗？”</tspan>
</text>
<polyline points="930,252 1100,252" class="arrow"/>
<text x="1015" y="238" text-anchor="middle" class="label">
<tspan x="1015" dy="0">归属有效</tspan>
</text>
<polyline points="930,380 1000,380 1000,280 1100,280" class="arrow"/>
<text x="1040" y="352" text-anchor="middle" class="label">
<tspan x="1040" dy="0">找到订单</tspan>
</text>
<rect x="1100" y="370" width="400" height="75" rx="13" class="state"/>
<text x="1300.0" y="401.0" text-anchor="middle" class="">
<tspan x="1300.0" dy="0">无订单咨询 general</tspan>
<tspan x="1300.0" dy="27">展示建议问题 + 历史订单入口</tspan>
</text>
<polyline points="930,405 1100,405" class="arrow"/>
<text x="1015" y="430" text-anchor="middle" class="label">
<tspan x="1015" dy="0">未找到</tspan>
</text>
<text x="60" y="490" text-anchor="start" class="section">
<tspan x="60" dy="0">推荐条件</tspan>
</text>
<text x="60" y="524" text-anchor="start" class="small">
<tspan x="60" dy="0">下单时间在最近 30 天内（含边界），或仍在运输，或有处理中的售后单；按下单时间倒序选择。</tspan>
</text>
<text x="60" y="552" text-anchor="start" class="small">
<tspan x="60" dy="0">订单页指定订单不受 30 天限制；推荐期限不决定售后资格。候选订单尚未绑定，继续进入 02。</tspan>
</text>
<rect x="32" y="614" width="1536" height="510" rx="20" fill="white" stroke="#dce4ee"/>
<text x="60" y="652" text-anchor="start" class="section">
<tspan x="60" dy="0">02  确认、否认与切换订单</tspan>
</text>
<text x="60" y="682" text-anchor="start" class="subtitle">
<tspan x="60" dy="0">蓝色框表示等待用户操作的会话状态；白色框表示单次请求中的后端处理。</tspan>
</text>
<rect x="60" y="740" width="220" height="85" rx="13" class="state"/>
<text x="170.0" y="776.0" text-anchor="middle" class="">
<tspan x="170.0" dy="0">候选订单 confirming</tspan>
<tspan x="170.0" dy="27">按钮：“是 / 不是”</tspan>
</text>
<rect x="400" y="720" width="240" height="65" rx="13" class="process"/>
<text x="520.0" y="759.5" text-anchor="middle" class="">
<tspan x="520.0" dy="0">校验并绑定咨询订单</tspan>
</text>
<rect x="400" y="850" width="240" height="80" rx="13" class="state"/>
<text x="520.0" y="883.5" text-anchor="middle" class="">
<tspan x="520.0" dy="0">替代入口 alternatives</tspan>
<tspan x="520.0" dy="27">已清除候选与绑定</tspan>
</text>
<polyline points="280,765 330,765 330,752 400,752" class="arrow"/>
<text x="341" y="739" text-anchor="middle" class="label">
<tspan x="341" dy="0">是</tspan>
</text>
<polyline points="280,790 330,790 330,890 400,890" class="arrow"/>
<text x="343" y="854" text-anchor="middle" class="label">
<tspan x="343" dy="0">不是</tspan>
</text>
<rect x="780" y="720" width="280" height="80" rx="13" class="success"/>
<text x="920.0" y="753.5" text-anchor="middle" class="">
<tspan x="920.0" dy="0">已绑定订单 bound</tspan>
<tspan x="920.0" dy="27">卡片下方展示 2～3 个问题</tspan>
</text>
<polyline points="640,752 780,752" class="arrow"/>
<text x="707" y="738" text-anchor="middle" class="label">
<tspan x="707" dy="0">校验通过</tspan>
</text>
<rect x="780" y="865" width="280" height="80" rx="13" class="state"/>
<text x="920.0" y="898.5" text-anchor="middle" class="">
<tspan x="920.0" dy="0">历史订单选择 selecting</tspan>
<tspan x="920.0" dy="27">仅查询本人在该店的订单</tspan>
</text>
<polyline points="640,890 780,890" class="arrow"/>
<text x="710" y="874" text-anchor="middle" class="label">
<tspan x="710" dy="0">咨询其他订单</tspan>
</text>
<polyline points="920,865 920,830 700,830 700,785 640,785" class="arrow"/>
<text x="784" y="815" text-anchor="middle" class="label">
<tspan x="784" dy="0">选定订单后重新核验</tspan>
</text>
<polyline points="1060,750 1100,750 1100,900 1060,900" class="arrow"/>
<text x="1140" y="830" text-anchor="middle" class="label">
<tspan x="1140" dy="0">切换订单</tspan>
</text>
<rect x="1220" y="865" width="280" height="80" rx="13" class="state"/>
<text x="1360.0" y="898.5" text-anchor="middle" class="">
<tspan x="1360.0" dy="0">无订单咨询 general</tspan>
<tspan x="1360.0" dy="27">商品或其他问题</tspan>
</text>
<polyline points="520,930 520,990 1360,990 1360,945" class="arrow"/>
<text x="960" y="1018" text-anchor="middle" class="label">
<tspan x="960" dy="0">商品及其他问题 / 取消选择</tspan>
</text>
<polyline points="1360,865 1360,842 1040,842 1040,865" class="arrow"/>
<text x="1260" y="825" text-anchor="middle" class="label">
<tspan x="1260" dy="0">咨询历史订单</tspan>
</text>
<text x="60" y="1065" text-anchor="start" class="small">
<tspan x="60" dy="0">所有状态均保留输入框。点击建议问题也提交为普通消息；进入 03 处理订单指向。</tspan>
</text>
<text x="60" y="1093" text-anchor="start" class="small">
<tspan x="60" dy="0">“不是”只展开替代入口；选择其他订单并核验成功后，才能成为新的咨询订单。</tspan>
</text>
<rect x="32" y="1148" width="1536" height="400" rx="20" fill="white" stroke="#dce4ee"/>
<text x="60" y="1186" text-anchor="start" class="section">
<tspan x="60" dy="0">03  自由输入与订单指向</tspan>
</text>
<text x="60" y="1216" text-anchor="start" class="subtitle">
<tspan x="60" dy="0">后台模型识别动作、诉求与订单指向；后端核验，不明确时要求用户澄清。</tspan>
</text>
<rect x="60" y="1270" width="220" height="80" rx="13" class="process"/>
<text x="170.0" y="1303.5" text-anchor="middle" class="">
<tspan x="170.0" dy="0">输入文字</tspan>
<tspan x="170.0" dy="27">或点击建议问题</tspan>
</text>
<rect x="350" y="1270" width="240" height="80" rx="13" class="process"/>
<text x="470.0" y="1303.5" text-anchor="middle" class="">
<tspan x="470.0" dy="0">识别意图与订单指向</tspan>
<tspan x="470.0" dy="27">qwen3.8-flash</tspan>
</text>
<polyline points="280,1310 350,1310" class="arrow"/>
<rect x="720" y="1250" width="360" height="75" rx="13" class="success"/>
<text x="900.0" y="1281.0" text-anchor="middle" class="">
<tspan x="900.0" dy="0">明确订单号 / 候选订单“这单”</tspan>
<tspan x="900.0" dy="27">后端校验后绑定</tspan>
</text>
<rect x="720" y="1360" width="360" height="65" rx="13" class="success"/>
<text x="900.0" y="1399.5" text-anchor="middle" class="">
<tspan x="900.0" dy="0">明确沿用已确认订单</tspan>
</text>
<rect x="1150" y="1250" width="350" height="75" rx="13" class="state"/>
<text x="1325.0" y="1281.0" text-anchor="middle" class="">
<tspan x="1325.0" dy="0">无订单问题</tspan>
<tspan x="1325.0" dy="27">保留原订单确认进度</tspan>
</text>
<rect x="1150" y="1360" width="350" height="75" rx="13" class="choice"/>
<text x="1325.0" y="1391.0" text-anchor="middle" class="">
<tspan x="1325.0" dy="0">订单指向不明确 clarifying</tspan>
<tspan x="1325.0" dy="27">选择订单，校验后继续待处理问题</tspan>
</text>
<polyline points="590,1295 640,1295 640,1287 720,1287" class="arrow"/>
<polyline points="640,1295 640,1392 720,1392" class="arrow"/>
<polyline points="590,1330 670,1330 670,1230 1325,1230 1325,1250" class="arrow"/>
<polyline points="670,1330 670,1460 1325,1460 1325,1435" class="arrow"/>
<text x="60" y="1509" text-anchor="start" class="small">
<tspan x="60" dy="0">消息先保存并入队；后台识别 → 核验订单 → 只读查询 → 保存回复，页面轮询展示。</tspan>
</text>
<text x="48" y="1601" text-anchor="start" class="subtitle">
<tspan x="48" dy="0">建议问题按支付状态、履约状态、售后进度及经校验的入口 SKU 选择；偏好与浏览数据源后续接入。</tspan>
</text>
<text x="48" y="1635" text-anchor="start" class="subtitle">
<tspan x="48" dy="0">会话绑定不授予退款或改址权限：业务执行前必须重新核验身份、目标订单、实时事实和操作权限。</tspan>
</text>
<text x="48" y="1689" text-anchor="start" class="small">
<tspan x="48" dy="0">维护：customer-reception.md 内含完整 Mermaid 状态图、接口契约和规则说明。SVG 为可独立查看的流程概览。</tspan>
</text>
</svg>
